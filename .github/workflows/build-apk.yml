name: 🚀 Build & Release Android APK (OTA Auto-Update)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;26.1.10909125 build-tools;34.0.0'

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install NPM Packages
        run: npm ci

      - name: 🏗️ Build Frontend Assets
        run: npm run build

      - name: 📲 Initialize Tauri Android (CI Mode)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

      - name: 🔨 Build Android APK
        run: npx @tauri-apps/cli android build --apk --ci --ignore-version-mismatches --target aarch64
        env:
          NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125

      - name: 🔑 Generate Keystore & Sign APK (Android V2/V3 Signature)
        run: |
          mkdir -p build_output
          
          # Find Android Build Tools path dynamically (where zipalign & apksigner live)
          BUILD_TOOLS_DIR=$(find /usr/local/lib/android/sdk/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "Using Android Build Tools: $BUILD_TOOLS_DIR"
          export PATH="$BUILD_TOOLS_DIR:$PATH"
          
          # Generate standard release keystore
          keytool -genkey -v -keystore release.keystore -alias ${{ secrets.KEYSTORE_ALIAS || 'opencap' }} -keyalg RSA -keysize 2048 -validity 10000 -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} -dname "CN=OPEN-CAP, OU=Mobile, O=OpenSource, L=Istanbul, C=TR"
          
          # Find produced APK
          UNSIGNED_APK=$(find src-tauri/gen/android -type f -name "*.apk" | head -n 1)
          echo "Found APK to sign: $UNSIGNED_APK"
          
          # Align & Sign with Android apksigner tool
          ALIGN_APK="build_output/aligned.apk"
          zipalign -v -p 4 "$UNSIGNED_APK" "$ALIGN_APK" || cp "$UNSIGNED_APK" "$ALIGN_APK"
          
          apksigner sign --ks release.keystore --ks-pass pass:${{ secrets.KEYSTORE_PASSWORD }} --key-pass pass:${{ secrets.KEY_PASSWORD }} --out build_output/OPEN-CAP-Mobile.apk "$ALIGN_APK"
          
          # Verify signature
          apksigner verify --verbose build_output/OPEN-CAP-Mobile.apk
          ls -lh build_output/

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPEN-CAP-Android-APK
          path: build_output/OPEN-CAP-Mobile.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release with Signed APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build_output/OPEN-CAP-Mobile.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
