name: 🚀 Build & Release Android APK (OTA Auto-Update)

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install NPM Packages
        run: npm ci

      - name: 🏗️ Build Frontend Assets
        run: npm run build

      - name: 📲 Initialize Tauri Android (CI Mode)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx @tauri-apps/cli android init --ci
          fi

      - name: 🔨 Build Android APK
        run: npx @tauri-apps/cli android build --apk --ci --target aarch64,armv7,x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_HOME }}

      - name: 🔍 Collect APK Outputs
        run: |
          mkdir -p build_output
          find src-tauri/gen/android -type f -name "*.apk" -exec cp {} build_output/ \;
          ls -la build_output/
          # Ensure a unified named APK exists
          FIRST_APK=$(ls build_output/*.apk | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" build_output/OPEN-CAP-Mobile.apk
          fi

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OPEN-CAP-Android-APK
          path: build_output/*.apk
          retention-days: 30

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build_output/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
