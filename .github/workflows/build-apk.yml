name: 🚀 Build & Release Android APK (OTA Auto-Update)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: 🦀 Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 📦 Setup Node.js & Dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 🛠️ Install NPM Packages
        run: npm ci

      - name: 🏗️ Build Frontend Assets
        run: npm run build

      - name: 📲 Initialize Tauri Android (if needed)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init
          fi

      - name: 🔨 Build Android APK
        run: npx tauri android build --apk

      - name: 🔍 Locate & Rename APK
        run: |
          mkdir -p build_output
          find src-tauri/gen/android -name "*.apk" -exec cp {} build_output/OPEN-CAP-latest.apk \;
          ls -lh build_output/

      - name: 🚀 Publish GitHub Release with APK & OTA Metadata
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            build_output/OPEN-CAP-latest.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
